name: CI

on:
  push:
    branches:
      - main
      - master
      - "codex/**"
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Swift build
        run: swift build

      - name: Swift test
        run: swift test

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Xcode build
        run: xcodebuild -project ./EventRecorder.xcodeproj -scheme EventRecorder -destination "platform=macOS" build
